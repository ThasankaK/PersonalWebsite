services:
  - type: web
    name: sudoku-solver-api
    runtime: python
    rootDir: backend
    startCommand: python main.py
    envVars:
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: CUDA_VISIBLE_DEVICES
        value: ""
    buildCommand: pip install -r requirements.txt
