services:
  - type: web
    name: sudoku-solver-api
    runtime: python
    pythonVersion: 3.11
    rootDir: backend
    startCommand: sh -c 'if [ -f main.py ]; then python main.py; else python backend/main.py; fi'
    envVars:
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: CUDA_VISIBLE_DEVICES
        value: ""
    buildCommand: sh -c 'if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r backend/requirements.txt; fi'
